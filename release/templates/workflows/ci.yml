name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, unit tests, spec lint, verifier self-check, black-box verify against the demo in workerd, then the
      # packed-package consumer test (installs the tarballs into a clean project and boots the README quickstart).
      - run: pnpm gate:release
