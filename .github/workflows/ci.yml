name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, unit tests, spec and decision lint, seeded-bug self-check, black-box verify in workerd, the mutation
      # catalog (the gate shows itself able to fail first), then the packed-package consumer test.
      - run: pnpm gate:release
